name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  swift:
    name: Swift (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test (also builds)
        run: swift test
        working-directory: ImageProcessorSwift
      - name: Release build
        run: swift build -c release
        working-directory: ImageProcessorSwift

  python:
    name: Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile check
        run: python -m py_compile crop_parallel_UI.py
